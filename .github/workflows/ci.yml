name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: End-to-end self-test (demo mode, no API key)
        run: python main.py --selftest
